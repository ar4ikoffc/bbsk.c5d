components:
  responses:
    BadRequest:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт уникальности или целостности данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Некорректные семантические данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, team, version]
      properties:
        status:
          type: string
          example: ok
        team:
          type: string
          example: BBSK
        version:
          type: string
          example: 1.0.0

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Ресурс не найден
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          example: dispatcher1
        password:
          type: string
          example: SuperSecret123!
        email:
          type: string
          format: email
          example: dispatcher@rostelecom.ru

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: dispatcher1
        password:
          type: string
          example: SuperSecret123!

    UserResponse:
      type: object
      required: [username, email, role, created_at]
      properties:
        username:
          type: string
          example: dispatcher1
        email:
          type: string
          example: dispatcher@rostelecom.ru
        role:
          type: string
          example: DISPATCHER
        created_at:
          type: string
          format: date-time

    BuildingType:
      type: string
      enum: [MKD, PRIVATE]
      description: '`MKD` — многоквартирный дом, `PRIVATE` — частный сектор'

    AccessNodeType:
      type: string
      enum: [OLT, SWITCH, DSLAM, CMTS]
      description: '`OLT` — PON, `SWITCH` — FTTB, `DSLAM` — xDSL, `CMTS` — DOCSIS'

    Technology:
      type: string
      enum: [PON, FTTB, XDSL, DOCSIS]

    Profile:
      type: string
      enum: [INSTALL, LTP3]

    DeadlineKind:
      type: string
      enum: [SLOT, HOURS, WORKING_DAYS]

    WorkTypeCode:
      type: string
      enum:
        - INST_PON_MKD
        - INST_FTTB_MKD
        - INST_PRIVATE_VLS
        - ADD_SERVICE
        - SURVEY_PRIVATE
        - REPAIR
        - DEGRADATION
        - DISMANTLE

    OpeningHoursDto:
      type: object
      required: [open, close]
      properties:
        open:
          type: string
          example: "08:00:00"
        close:
          type: string
          example: "21:00:00"

    BreakWindowDto:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          example: "12:00:00"
        to:
          type: string
          example: "15:00:00"

    ShiftDto:
      type: object
      required: [start, end, break_window]
      properties:
        start:
          type: string
          example: "08:00:00"
        end:
          type: string
          example: "20:00:00"
        break_duration_min:
          type: integer
          example: 60
        break_window:
          $ref: '#/components/schemas/BreakWindowDto'

    ShiftResponse:
      type: object
      required: [id, start_time, end_time, break_duration_min, break_window_from, break_window_to]
      properties:
        id:
          type: string
          format: uuid
        start_time:
          type: string
          example: "08:00:00"
        end_time:
          type: string
          example: "20:00:00"
        break_duration_min:
          type: integer
          example: 60
        break_window_from:
          type: string
          example: "12:00:00"
        break_window_to:
          type: string
          example: "15:00:00"

    CreateShiftRequest:
      type: object
      required: [start_time, end_time, break_window_from, break_window_to]
      properties:
        start_time:
          type: string
          example: "08:00:00"
        end_time:
          type: string
          example: "20:00:00"
        break_duration_min:
          type: integer
          example: 60
        break_window_from:
          type: string
          example: "12:00:00"
        break_window_to:
          type: string
          example: "15:00:00"

