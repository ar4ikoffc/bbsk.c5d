openapi: 3.0.3
info:
  title: Умная диспетчеризация выездных бригад (BBSK API)
  description: |
    API сервиса оперативного планирования и управления выездными бригадами (Кейс №05 «Ростелеком»).
    Решает задачу маршрутизации выездных сотрудников с временными окнами (VRPTW), квалификационными профилями, технологиями, багажником оборудования и динамическими событиями смены.
  version: 1.0.0
  contact:
    name: Команда BBSK (C5D)

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки / Docker Compose

tags:
  - name: "Служебные методы"
    description: "Проверка работоспособности и готовности сервиса (health check)"
  - name: "Аутентификация"
    description: "Авторизация пользователей, выпуск и валидация JWT (HttpOnly cookie)"
  - name: "Сотрудники и смены"
    description: "Управление выездными сотрудниками, квалификацией, багажником и графиками смен (CRUD)"
  - name: "Инфраструктура и здания"
    description: "Управление зданиями (MKD/PRIVATE), узлами доступа связи (OLT, SWITCH) и сервисными центрами (СЦ)"
  - name: "Типы работ"
    description: "Справочник нормативных типов работ, контрольных сроков (SLA) и необходимых профилей"
  - name: "Справочные данные"
    description: "Пакетная инициализация справочников и единой матрицы времени в пути (benchmark)"
  - name: "Наряды на работы (Orders)"
    description: "Управление нарядами на выездные работы: создание, фильтрация, детальный просмотр, обновление параметров и статусов, удаление (CRUD)"
  - name: "Рабочие дни (Days)"
    description: "Пакетная инициализация контекста дня, заказов и отсутствующих сотрудников"
  - name: "План смены (Plan)"
    description: "Расчет и получение оптимального суточного плана распределения нарядов и маршрутизации"
  - name: "События смены (Events)"
    description: "Регистрация внешних событий (отмены, новые заявки, сходы) и реактивное перепланирование"
  - name: "Python Solver"
    description: "Модуль Multi-Vehicle VRPTW оптимизации маршрутов (порт 8000)"


paths:
  /api/v1/health:
    get:
      tags: ["Служебные методы"]
      summary: Проверка готовности сервиса
      description: Возвращает статус готовности сервиса к приему данных.
      responses:
        '200':
          description: Сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: ["Аутентификация"]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: ["Аутентификация"]
      summary: Вход в систему (получение JWT в HttpOnly cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход (cookie access_token установлен)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: ["Аутентификация"]
      summary: Выход из системы (очистка JWT cookie)
      responses:
        '200':
          description: Cookie успешно очищена

  /api/v1/auth/me:
    get:
      tags: ["Аутентификация"]
      summary: Получение данных текущего авторизованного пользователя
      responses:
        '200':
          description: Данные профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/staff:
    get:
      tags: ["Сотрудники и смены"]
      summary: Получить список всех сотрудников
      parameters:
        - name: service_center_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Фильтр по UUID сервисного центра
      responses:
        '200':
          description: Список сотрудников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffResponse'
    post:
      tags: ["Сотрудники и смены"]
      summary: Создать сотрудника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Сотрудник создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/staff/{id}:
    get:
      tags: ["Сотрудники и смены"]
      summary: Получить сотрудника по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Сотрудник найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Сотрудники и смены"]
      summary: Обновить сотрудника по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: Сотрудник обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Сотрудники и смены"]
      summary: Удалить сотрудника по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Сотрудник удален
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/staff/shifts:
    get:
      tags: ["Сотрудники и смены"]
      summary: Список всех графиков смен
      responses:
        '200':
          description: Список смен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftResponse'
    post:
      tags: ["Сотрудники и смены"]
      summary: Создать новый график смены
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: Смена создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'

  /api/v1/staff/shifts/{id}:
    get:
      tags: ["Сотрудники и смены"]
      summary: Получить смену по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Смена найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Сотрудники и смены"]
      summary: Удалить смену по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Смена удалена
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/buildings:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Получить список обслуживаемых зданий
      parameters:
        - name: building_type
          in: query
          schema:
            $ref: '#/components/schemas/BuildingType'
        - name: access_node_id
          in: query
          schema:
            type: string
            format: uuid
        - name: service_center_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список зданий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuildingResponse'
    post:
      tags: ["Инфраструктура и здания"]
      summary: Создать новое здание
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          description: Здание создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'

  /api/v1/buildings/{id}:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Получить здание по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Инфраструктура и здания"]
      summary: Обновить здание по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Инфраструктура и здания"]
      summary: Удалить здание по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Здание удалено
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/buildings/access-nodes:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Список узлов доступа связи
      parameters:
        - name: technology
          in: query
          schema:
            $ref: '#/components/schemas/Technology'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessNodeResponse'
    post:
      tags: ["Инфраструктура и здания"]
      summary: Создать узел доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessNodeRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessNodeResponse'

  /api/v1/buildings/access-nodes/{id}:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Получить узел доступа по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessNodeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Инфраструктура и здания"]
      summary: Обновить узел доступа по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessNodeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessNodeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Инфраструктура и здания"]
      summary: Удалить узел доступа по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Узел доступа удален
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/buildings/service-centers:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Список сервисных центров
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCenterResponse'
    post:
      tags: ["Инфраструктура и здания"]
      summary: Создать сервисный центр
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCenterRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCenterResponse'

  /api/v1/buildings/service-centers/{id}:
    get:
      tags: ["Инфраструктура и здания"]
      summary: Получить СЦ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCenterResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Инфраструктура и здания"]
      summary: Обновить СЦ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceCenterRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCenterResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Инфраструктура и здания"]
      summary: Удалить СЦ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: СЦ удален
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/work-types:
    get:
      tags: ["Типы работ"]
      summary: Список всех типов работ со сроками и профилями
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkTypeResponse'
    post:
      tags: ["Типы работ"]
      summary: Создать тип работ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkTypeRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTypeResponse'

  /api/v1/work-types/{id}:
    get:
      tags: ["Типы работ"]
      summary: Получить тип работ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTypeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Типы работ"]
      summary: Обновить тип работ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkTypeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTypeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: ["Типы работ"]
      summary: Удалить тип работ по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Тип работ удален
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/reference:
    put:
      tags: ["Справочные данные"]
      summary: Загрузить справочники (полная пакетная инициализация)
      description: |
        Полностью перезагружает справочные данные (СЦ, сотрудники, узлы с домами, типы работ).
        Все загруженные ранее дни, планы и события удаляются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceDataRequest'
      responses:
        '200':
          description: Справочники успешно загружены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/reference/travel-matrix:
    put:
      tags: ["Справочные данные"]
      summary: Загрузить единую матрицу времени в пути
      description: Сохраняет матрицу времени в пути и расстояний между всеми точками (СЦ и дома).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelMatrixRequest'
      responses:
        '200':
          description: Матрица успешно загружена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/orders:
    get:
      tags: ["Наряды на работы (Orders)"]
      summary: Получить список нарядов
      description: Возвращает список нарядов на выполнение выездных работ с поддержкой фильтрации по рабочему дню, дате, статусу, зданию и типу работ.
      parameters:
        - name: day_id
          in: query
          required: false
          description: Фильтр по UUID рабочего дня
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        - name: date
          in: query
          required: false
          description: Фильтр по календарной дате рабочего дня (YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "2026-10-26"
        - name: status
          in: query
          required: false
          description: Фильтр по статусу наряда (PENDING, ASSIGNED, COMPLETED, CANCELLED, UNASSIGNED)
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: building_id
          in: query
          required: false
          description: Фильтр по UUID здания / объекта обслуживания
          schema:
            type: string
            format: uuid
          example: "4ba85f64-5717-4562-b3fc-2c963f66afa7"
        - name: work_type_id
          in: query
          required: false
          description: Фильтр по UUID типа работ
          schema:
            type: string
            format: uuid
          example: "c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f"
      responses:
        '200':
          description: Список нарядов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrderResponse'
    post:
      tags: ["Наряды на работы (Orders)"]
      summary: Создать наряд на работы
      description: |
        Создает новый наряд на выездные работы. Проверяет существование связанных сущностей (рабочий день, тип работ, здание, узел доступа, СЦ) и уникальность номера наряда. При отсутствии необязательных параметров (latest_start, deadline, access_node, service_center) вычисляет их автоматически по нормативам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: Наряд успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный идентификатор наряда (UUID)
        schema:
          type: string
          format: uuid
        example: "7ca85f64-5717-4562-b3fc-2c963f66afa9"
    get:
      tags: ["Наряды на работы (Orders)"]
      summary: Получить наряд по ID
      description: Возвращает детальную информацию о наряде по его внутреннему идентификатору (UUID).
      responses:
        '200':
          description: Наряд найден
          content:
            application/json:
